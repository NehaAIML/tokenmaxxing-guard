[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenmaxxing-guard"
version = "0.2.0"
description = "Unified FinOps and SecOps guardrails for AI agents: budgets, least-privilege scopes and an audit trail in one control point."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "NehaAIML" }]
keywords = ["ai-agents", "finops", "secops", "guardrails", "llm", "cost-control", "least-privilege"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/NehaAIML/tokenmaxxing-guard"
Issues = "https://github.com/NehaAIML/tokenmaxxing-guard/issues"
Changelog = "https://github.com/NehaAIML/tokenmaxxing-guard/blob/main/CHANGELOG.md"

[project.scripts]
tokenmaxxing-guard = "tokenmaxxing_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenmaxxing_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=tokenmaxxing_guard --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["UP006", "UP007", "UP035", "UP045", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
